<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Lab — GTA-style cover maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">VCL</span><span class="brand-name">Vice Cover Lab</span></div>
  <p class="tagline">Turn any photo into a Vice City poster. Offline, on your machine.</p>
</header>
<main class="studio">
  <section class="preview-wrap">
    <canvas id="stage" width="1080" height="1080" aria-label="Cover preview"></canvas>
    <p class="hint">Drag a panel to move its photo. Click a panel to select it, then zoom.</p>
  </section>
  <aside class="controls" id="controls">
    <div class="group" id="group-layout">
      <h2>Layout</h2>
      <div class="row" id="layoutRow"></div>
    </div>
    <div class="group" id="group-grade">
      <h2>Grade</h2>
      <div class="row" id="gradeRow"></div>
    </div>
    <div class="group" id="group-photos">
      <h2>Photos</h2>
      <label class="upload">Add photos
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </label>
      <button type="button" id="sampleBtn">Use sample photos</button>
      <div class="strip" id="photoStrip"></div>
    </div>
    <div class="group" id="group-words">
      <h2>Words</h2>
      <label>Title <input type="text" id="titleInput" value="VICE CITY" maxlength="24"></label>
      <label>Subtitle <input type="text" id="subInput" value="nights on the boulevard" maxlength="48"></label>
      <label>Zoom <input type="range" id="zoomInput" min="1" max="2.5" step="0.05" value="1.2"></label>
    </div>
    <div class="group" id="group-finish">
      <h2>Finish</h2>
      <div class="row" id="sizeRow"></div>
      <div class="row">
        <button type="button" id="undoBtn">Undo</button>
        <button type="button" id="redoBtn">Redo</button>
        <button type="button" id="exportBtn" class="primary">Export PNG</button>
      </div>
      <p class="note">Photos never leave your machine. No Rockstar logo, artwork or font is used.</p>
    </div>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
